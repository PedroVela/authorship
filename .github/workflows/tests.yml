name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"  # the oldest supported
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # tests decode subprocess output as UTF-8 on Windows too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: openssl version
        shell: bash
      - run: python -m pytest -q authorship/tests
